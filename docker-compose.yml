version: '3.8'

services:
  # 1. กล่องฐานข้อมูล PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: bidkan-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. กล่องตัวกลาง MQTT (Mosquitto)
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: bidkan-mqtt
    restart: always
    ports:
      - "1883:1883" # พอร์ตสำหรับให้ ESP32 คุยด้วย
      - "9001:9001" # พอร์ตสำหรับ WebSockets (เผื่อใช้หน้าเว็บ)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # 3. Redis สำหรับ Caching พิกัดล่าสุด & User Rank & Configs
  redis:
    image: redis:7-alpine
    container_name: bidkan-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. กล่องสมองกล Go Backend (API & MQTT Listener)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bidkan-backend
    restart: always
    ports:
      - "8080:8080" # พอร์ต API ที่จะให้แอปมือถือเรียกใช้
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - .:/app  # เชื่อมโค้ดในเครื่องเข้ากับ Docker
    environment:
      # ใช้ DATABASE_URL ให้ตรงกับโค้ด Go และดึงค่าจาก .env มาประกอบ
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - MQTT_BROKER=tcp://mqtt:1883
      - REDIS_URL=redis:6379
      - PORT=${PORT}
      - APP_ENV=${APP_ENV:-development}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - PAYSOLUTIONS_WEBHOOK_SECRET=${PAYSOLUTIONS_WEBHOOK_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_CONNECT_WEBHOOK_SECRET=${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      - STRIPE_CONNECT_ACCOUNT_TYPE=${STRIPE_CONNECT_ACCOUNT_TYPE:-express}
      - STRIPE_CONNECT_COUNTRY=${STRIPE_CONNECT_COUNTRY:-TH}
      - STRIPE_BACKOFFICE_URL=${STRIPE_BACKOFFICE_URL:-http://localhost:3001}
      - STRIPE_CLIENT_URL=${STRIPE_CLIENT_URL:-http://localhost:3000}
      - STRIPE_AUTO_PAYOUT_ENABLED=${STRIPE_AUTO_PAYOUT_ENABLED:-false}
      - STRIPE_AUTO_PAYOUT_INTERVAL=${STRIPE_AUTO_PAYOUT_INTERVAL:-24h}

  # 5. MQTTX Web UI สำหรับทดสอบผ่านเบราว์เซอร์
  mqttx:
    image: emqx/mqttx-web
    container_name: bidkan-mqttx-web
    ports:
      - "8081:80"
    restart: always

volumes:
  pgdata:
  redis_data:
