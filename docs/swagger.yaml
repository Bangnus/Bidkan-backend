basePath: /api
definitions:
  end.Request:
    properties:
      lat:
        type: number
      lon:
        type: number
      user_id:
        type: string
    required:
    - lat
    - lon
    - user_id
    type: object
  entity.BikeData:
    properties:
      battery:
        type: integer
      bike_id:
        type: string
      current_ride_id:
        type: string
      hardware_id:
        type: string
      image_url:
        type: string
      last_heartbeat:
        type: string
      lat:
        type: number
      lon:
        type: number
      status:
        type: string
    type: object
  entity.Ride:
    properties:
      bikeID:
        type: string
      createdAt:
        type: string
      distanceKm:
        format: float64
        type: number
      endLat:
        format: float64
        type: number
      endLon:
        format: float64
        type: number
      endTime:
        type: string
      id:
        type: string
      startLat:
        format: float64
        type: number
      startLon:
        format: float64
        type: number
      startTime:
        type: string
      status:
        type: string
      totalFare:
        type: string
      updatedAt:
        type: string
      userID:
        type: string
    type: object
  internal_app_usecase_bike_create.Request:
    properties:
      bike_id:
        type: string
      hardware_id:
        type: string
      image_url:
        type: string
    required:
    - bike_id
    - hardware_id
    type: object
  internal_app_usecase_user_create.Request:
    properties:
      password:
        example: password123
        minLength: 6
        type: string
      phone_number:
        example: "0812345678"
        minLength: 10
        type: string
      username:
        example: somchai_jaidee
        minLength: 2
        type: string
    required:
    - password
    - phone_number
    - username
    type: object
  login.Request:
    properties:
      password:
        example: password123
        type: string
      username:
        example: somchai_jaidee
        type: string
    required:
    - password
    - username
    type: object
  login.Response:
    properties:
      role:
        type: string
      token:
        type: string
    type: object
  me.Response:
    properties:
      id:
        type: string
      phone_number:
        type: string
      role:
        type: string
      status:
        type: string
      username:
        type: string
    type: object
  start.Request:
    properties:
      bike_id:
        type: string
      user_id:
        type: string
    required:
    - bike_id
    - user_id
    type: object
  verify_firebase.Request:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a sample server for Bidkan Clean Architecture.
  title: Bidkan Backend API
  version: "1.0"
paths:
  /v1/bikes:
    get:
      description: Get a list of all bikes in the system.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.BikeData'
            type: array
      summary: List All Bikes (Admin)
      tags:
      - Bikes
    post:
      consumes:
      - application/json
      description: Add a new bike to the system.
      parameters:
      - description: Bike creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_app_usecase_bike_create.Request'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create New Bike (Admin)
      tags:
      - Bikes
  /v1/bikes/available:
    get:
      description: Get a list of bikes that are available for rent.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.BikeData'
            type: array
      summary: List Available Bikes
      tags:
      - Bikes
  /v1/rides/end:
    post:
      consumes:
      - application/json
      description: Stop the current ride and calculate fare.
      parameters:
      - description: End ride request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/end.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Ride'
      security:
      - BearerAuth: []
      summary: End Ride (Return Bike)
      tags:
      - Rides
  /v1/rides/start:
    post:
      consumes:
      - application/json
      description: Start a new ride by scanning a bike QR code.
      parameters:
      - description: Start ride request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/start.Request'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Ride'
      security:
      - BearerAuth: []
      summary: Start Ride (Rent Bike)
      tags:
      - Rides
  /v1/users:
    post:
      consumes:
      - application/json
      description: Register a new user with phone number, username, and password.
        After success, an OTP will be sent.
      parameters:
      - description: User creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_app_usecase_user_create.Request'
      produces:
      - application/json
      responses:
        "201":
          description: User created pending, OTP sent
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation failed
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new user (and send OTP)
      tags:
      - Users
  /v1/users/login:
    post:
      consumes:
      - application/json
      description: Login with username and password to receive a JWT token.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/login.Request'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged in
          schema:
            $ref: '#/definitions/login.Response'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login User
      tags:
      - Users
  /v1/users/me:
    get:
      consumes:
      - application/json
      description: Get currently logged-in user profile from JWT token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.Response'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get My Profile
      tags:
      - Users
  /v1/users/verify/firebase:
    post:
      consumes:
      - application/json
      description: Verify the idToken received from Firebase on Frontend to activate
        the user account.
      parameters:
      - description: Firebase verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/verify_firebase.Request'
      produces:
      - application/json
      responses:
        "200":
          description: User activated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid token or request
          schema:
            additionalProperties: true
            type: object
      summary: Verify Firebase Token and Activate User
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: Type 'Bearer ' followed by your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
