basePath: /api
definitions:
  create.Request:
    properties:
      password:
        example: password123
        minLength: 6
        type: string
      phone_number:
        example: "0812345678"
        minLength: 10
        type: string
      username:
        example: somchai_jaidee
        minLength: 2
        type: string
    required:
    - password
    - phone_number
    - username
    type: object
  login.Request:
    properties:
      password:
        example: password123
        type: string
      username:
        example: somchai_jaidee
        type: string
    required:
    - password
    - username
    type: object
  login.Response:
    properties:
      role:
        type: string
      token:
        type: string
    type: object
  me.Response:
    properties:
      id:
        type: string
      phone_number:
        type: string
      role:
        type: string
      status:
        type: string
      username:
        type: string
    type: object
  otp.Request:
    properties:
      phone_number:
        example: "0812345678"
        minLength: 10
        type: string
    required:
    - phone_number
    type: object
  verify.Request:
    properties:
      otp:
        example: "123456"
        type: string
    required:
    - otp
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a sample server for Bidkan Clean Architecture.
  title: Bidkan Backend API
  version: "1.0"
paths:
  /v1/users:
    post:
      consumes:
      - application/json
      description: Register a new user with phone number, username, and password.
        After success, an OTP will be sent.
      parameters:
      - description: User creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/create.Request'
      produces:
      - application/json
      responses:
        "201":
          description: User created pending, OTP sent
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation failed
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new user (and send OTP)
      tags:
      - Users
  /v1/users/login:
    post:
      consumes:
      - application/json
      description: Login with username and password to receive a JWT token.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/login.Request'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged in
          schema:
            $ref: '#/definitions/login.Response'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login User
      tags:
      - Users
  /v1/users/me:
    get:
      consumes:
      - application/json
      description: Get currently logged-in user profile from JWT token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.Response'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get My Profile
      tags:
      - Users
  /v1/users/otp:
    post:
      consumes:
      - application/json
      description: Send OTP to phone number
      parameters:
      - description: OTP request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/otp.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OTP sent successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
      summary: Request OTP
      tags:
      - Users
  /v1/users/verify:
    post:
      consumes:
      - application/json
      description: Verify the account using ONLY the OTP code received.
      parameters:
      - description: Verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/verify.Request'
      produces:
      - application/json
      responses:
        "200":
          description: User activated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid OTP or request
          schema:
            additionalProperties: true
            type: object
      summary: Verify OTP and Activate User
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer " followed by your JWT token. (Example: Bearer eyJhbG...)'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
