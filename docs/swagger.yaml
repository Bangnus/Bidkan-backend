basePath: /api
definitions:
  broadcast.Request:
    properties:
      message:
        type: string
      title:
        type: string
      type:
        description: promo, news, system
        type: string
    required:
    - message
    - title
    - type
    type: object
  config.Request:
    properties:
      key:
        type: string
      value:
        type: string
    required:
    - key
    - value
    type: object
  end.Request:
    properties:
      coupon_code:
        description: เพิ่มฟิลด์เลือกใช้คูปอง (Optional)
        type: string
      user_id:
        type: string
    required:
    - user_id
    type: object
  entity.BikeData:
    properties:
      battery:
        type: integer
      bike_id:
        type: string
      current_ride_id:
        type: string
      hardware_id:
        type: string
      image_url:
        type: string
      last_heartbeat:
        type: string
      lat:
        type: number
      lon:
        type: number
      status:
        type: string
    type: object
  entity.BikeUsageStat:
    properties:
      bike_id:
        type: string
      ride_count:
        type: integer
      total_distance_km:
        type: number
      total_revenue:
        type: string
    type: object
  entity.DailyRevenue:
    properties:
      daily_revenue:
        type: string
      date:
        type: string
      ride_count:
        type: integer
    type: object
  entity.FullReport:
    properties:
      bike_stats:
        items:
          $ref: '#/definitions/entity.BikeUsageStat'
        type: array
      daily_revenue:
        items:
          $ref: '#/definitions/entity.DailyRevenue'
        type: array
      summary:
        $ref: '#/definitions/entity.SystemSummary'
    type: object
  entity.Ride:
    properties:
      bikeID:
        type: string
      createdAt:
        type: string
      distanceKm:
        format: float64
        type: number
      endLat:
        format: float64
        type: number
      endLon:
        format: float64
        type: number
      endTime:
        type: string
      id:
        type: string
      startLat:
        format: float64
        type: number
      startLon:
        format: float64
        type: number
      startTime:
        type: string
      status:
        description: ongoing, completed, cancelled
        type: string
      totalFare:
        type: string
      type:
        description: ride, service
        type: string
      updatedAt:
        type: string
      userID:
        type: string
    type: object
  entity.SystemSummary:
    properties:
      active_rides:
        type: integer
      available_bikes:
        type: integer
      total_bikes:
        type: integer
      total_revenue:
        type: string
      total_users:
        type: integer
    type: object
  entity.Zone:
    properties:
      boundary:
        type: string
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      radius:
        format: float64
        type: number
      type:
        type: string
      updatedAt:
        type: string
    type: object
  geo.Point:
    properties:
      lat:
        type: number
      lon:
        type: number
    type: object
  internal_app_usecase_bike_create.Request:
    properties:
      bike_id:
        type: string
      hardware_id:
        type: string
      image_url:
        type: string
    required:
    - bike_id
    - hardware_id
    type: object
  internal_app_usecase_coupon_create.Request:
    properties:
      code:
        type: string
      expired_at:
        type: string
      max_uses:
        type: integer
      min_amount:
        type: string
      start_at:
        type: string
      type:
        description: credit, discount
        type: string
      value:
        type: string
    required:
    - code
    - expired_at
    - max_uses
    - type
    - value
    type: object
  internal_app_usecase_user_create.Request:
    properties:
      password:
        example: password123
        minLength: 6
        type: string
      phone_number:
        example: "0812345678"
        minLength: 10
        type: string
      username:
        example: somchai_jaidee
        minLength: 2
        type: string
    required:
    - password
    - phone_number
    - username
    type: object
  internal_app_usecase_zone_create.Request:
    properties:
      boundary:
        description: ขอบเขต Polygon
        items:
          $ref: '#/definitions/geo.Point'
        type: array
      name:
        type: string
      radius:
        description: ถ้าระบุ Radius จะใช้เป็นวงกลม (ใช้พิกัดแรกใน Boundary เป็นจุดศูนย์กลาง)
        type: number
      type:
        description: '"P" หรือ "Area"'
        type: string
    required:
    - name
    - type
    type: object
  list.NotificationInfo:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      message:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  list_my.CouponInfo:
    properties:
      code:
        type: string
      collected_at:
        type: string
      expired_at:
        type: string
      id:
        type: string
      min_amount:
        type: string
      type:
        type: string
      user_coupon_id:
        type: string
      value:
        type: string
    type: object
  login.Request:
    properties:
      password:
        example: password123
        type: string
      username:
        example: somchai_jaidee
        type: string
    required:
    - password
    - username
    type: object
  login.Response:
    properties:
      role:
        type: string
      token:
        type: string
    type: object
  me.Response:
    properties:
      id:
        type: string
      phone_number:
        type: string
      role:
        type: string
      status:
        type: string
      username:
        type: string
    type: object
  rank.Response:
    properties:
      current_discount:
        type: number
      current_rank:
        type: string
      next_rank_threshold:
        type: number
      progress_percentage:
        type: number
      total_spent_4_months:
        type: number
    type: object
  redeem.Request:
    properties:
      code:
        type: string
      user_id:
        type: string
    type: object
  start.Request:
    properties:
      bike_id:
        type: string
      user_id:
        type: string
    required:
    - bike_id
    - user_id
    type: object
  topup.Request:
    properties:
      amount:
        type: number
    required:
    - amount
    type: object
  topup.Response:
    properties:
      amount:
        type: number
      qr_code_url:
        type: string
      transaction_id:
        type: string
    type: object
  transfer.Request:
    properties:
      amount:
        type: number
      receiver_phone:
        type: string
      sender_id:
        type: string
    type: object
  update_profile.Request:
    properties:
      image_url:
        type: string
    required:
    - image_url
    type: object
  update_status.Request:
    properties:
      bike_id:
        type: string
      status:
        type: string
    type: object
  update_token.Request:
    properties:
      fcm_token:
        type: string
    required:
    - fcm_token
    type: object
  verify_firebase.Request:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  verify_receiver.Response:
    properties:
      phone_number:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a sample server for Bidkan Clean Architecture.
  title: Bidkan Backend API
  version: "1.0"
paths:
  /v1/admin/notifications/broadcast:
    post:
      consumes:
      - application/json
      description: แอดมินส่งข่าวสาร โปรโมชั่น หรือประกาศสำคัญไปยังผู้ใช้ทุกคนผ่าน
        MQTT และ Push Notification
      parameters:
      - description: เนื้อหาที่ต้องการประกาศ
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/broadcast.Request'
      produces:
      - application/json
      responses:
        "200":
          description: ส่งประกาศสำเร็จ
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: ไม่มีสิทธิ์ (เฉพาะแอดมินเท่านั้น)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: ส่งประกาศแจ้งเตือนหาทุกคน (Admin Only)
      tags:
      - Notifications
  /v1/bikes:
    get:
      description: ดึงข้อมูลรถจักรยานทั้งหมด (ถ้าเป็น User ทั่วไปจะเห็นเฉพาะรถที่ว่าง,
        ถ้าเป็น Staff/Admin จะเห็นทั้งหมด)
      produces:
      - application/json
      responses:
        "200":
          description: รายการรถจักรยาน
          schema:
            items:
              $ref: '#/definitions/entity.BikeData'
            type: array
      security:
      - BearerAuth: []
      summary: รายการรถจักรยาน
      tags:
      - Bikes
    post:
      consumes:
      - application/json
      description: Add a new bike to the system.
      parameters:
      - description: Bike creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_app_usecase_bike_create.Request'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create New Bike (Admin)
      tags:
      - Bikes
  /v1/bikes/{id}/status:
    patch:
      consumes:
      - application/json
      description: เปลี่ยนสถานะของรถจักรยาน (เช่น เปลี่ยนเป็น maintenance หรือ unavailable)
        - เฉพาะ Staff/Admin เท่านั้น
      parameters:
      - description: ไอดีรถจักรยาน
        in: path
        name: id
        required: true
        type: string
      - description: สถานะใหม่ที่ต้องการเปลี่ยน
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/update_status.Request'
      produces:
      - application/json
      responses:
        "200":
          description: อัปเดตสำเร็จ
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ข้อมูลไม่ถูกต้อง
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: ไม่มีสิทธิ์เข้าถึง (ต้องเป็น Staff หรือ Admin)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: อัปเดตสถานะรถจักรยาน
      tags:
      - Bikes
  /v1/configs:
    post:
      consumes:
      - application/json
      description: Set a global configuration value (e.g. parking_penalty_fee).
      parameters:
      - description: Config request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/config.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Set System Config (Admin)
      tags:
      - Configs
  /v1/configs/{key}:
    get:
      description: Get a global configuration value by key.
      parameters:
      - description: Config Key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get System Config
      tags:
      - Configs
  /v1/coupons:
    post:
      consumes:
      - application/json
      description: แอดมินสร้างคูปองใหม่ กำหนดโค้ด ประเภท และมูลค่าได้เอง
      parameters:
      - description: รายละเอียดคูปอง
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_app_usecase_coupon_create.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create Coupon (Admin Only)
      tags:
      - Coupons
  /v1/coupons/my:
    get:
      description: ดึงรายการคูปองส่วนลดที่ผู้ใช้เก็บสะสมไว้และยังไม่ได้นำไปใช้งาน
      produces:
      - application/json
      responses:
        "200":
          description: รายการคูปองที่ใช้งานได้
          schema:
            items:
              $ref: '#/definitions/list_my.CouponInfo'
            type: array
        "401":
          description: ไม่ได้รับอนุญาต
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: รายการคูปองของฉัน
      tags:
      - Coupons
  /v1/coupons/redeem:
    post:
      consumes:
      - application/json
      description: กรอกโค้ดเพื่อรับเงินฟรีเข้า Wallet หรือเก็บโค้ดส่วนลดไว้ใช้หักค่าขี่ในอนาคต
      parameters:
      - description: โค้ดคูปองที่ต้องการใช้
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/redeem.Request'
      produces:
      - application/json
      responses:
        "200":
          description: ใช้คูปองสำเร็จ
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: โค้ดไม่ถูกต้อง หรือหมดอายุ หรือถูกใช้ไปแล้ว
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: ใช้โค้ดคูปอง
      tags:
      - Coupons
  /v1/notifications:
    get:
      description: ดึงประวัติการแจ้งเตือนทั้งหมดของผู้ใช้ (รวมทั้งประกาศส่วนกลางและแจ้งเตือนส่วนตัว)
      produces:
      - application/json
      responses:
        "200":
          description: รายการแจ้งเตือน
          schema:
            items:
              $ref: '#/definitions/list.NotificationInfo'
            type: array
      security:
      - BearerAuth: []
      summary: รายการแจ้งเตือนของฉัน
      tags:
      - Notifications
  /v1/notifications/fcm-token:
    post:
      consumes:
      - application/json
      description: อัปเดต Token สำหรับส่ง Push Notification
      parameters:
      - description: FCM Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/update_token.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update FCM Token
      tags:
      - Notifications
  /v1/reports/summary:
    get:
      description: ดึงข้อมูลรายงานสรุปยอดรวม เช่น รายได้รวม จำนวนผู้ใช้ และสถิติการใช้งานรถจักรยาน
      produces:
      - application/json
      responses:
        "200":
          description: ข้อมูลรายงานสรุป
          schema:
            $ref: '#/definitions/entity.FullReport'
        "403":
          description: ไม่มีสิทธิ์ (เฉพาะแอดมินเท่านั้น)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: รายงานสรุปภาพรวมระบบ (Admin Only)
      tags:
      - Reports
  /v1/rides/end:
    post:
      consumes:
      - application/json
      description: จบการขี่จักรยาน คำนวณค่าบริการ หักเงินใน Wallet และคืนสถานะรถให้ว่าง
      parameters:
      - description: ข้อมูลการจบการเช่า
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/end.Request'
      produces:
      - application/json
      responses:
        "200":
          description: จบการเช่าและชำระเงินสำเร็จ
          schema:
            $ref: '#/definitions/entity.Ride'
      security:
      - BearerAuth: []
      summary: จบการเช่ารถจักรยาน
      tags:
      - Rides
  /v1/rides/start:
    post:
      consumes:
      - application/json
      description: เริ่มต้นการขี่จักรยานโดยระบุไอดีรถที่ต้องการ (สแกน QR Code)
      parameters:
      - description: ข้อมูลการเริ่มเช่า
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/start.Request'
      produces:
      - application/json
      responses:
        "201":
          description: เริ่มการเช่าสำเร็จ
          schema:
            $ref: '#/definitions/entity.Ride'
      security:
      - BearerAuth: []
      summary: เริ่มการเช่ารถจักรยาน
      tags:
      - Rides
  /v1/users:
    post:
      consumes:
      - application/json
      description: ลงทะเบียนผู้ใช้ใหม่ด้วยเบอร์โทรศัพท์ ชื่อผู้ใช้ และรหัสผ่าน หลังจากสำเร็จจะส่งรหัส
        OTP ไปยังเบอร์ที่ระบุ
      parameters:
      - description: ข้อมูลการสมัครสมาชิก
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_app_usecase_user_create.Request'
      produces:
      - application/json
      responses:
        "201":
          description: สมัครสมาชิกสำเร็จ รอการยืนยัน OTP
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ข้อมูลไม่ถูกต้อง หรือการตรวจสอบไม่ผ่าน
          schema:
            additionalProperties: true
            type: object
        "500":
          description: เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์
          schema:
            additionalProperties: true
            type: object
      summary: สมัครสมาชิกใหม่ (และส่ง OTP)
      tags:
      - Users
  /v1/users/login:
    post:
      consumes:
      - application/json
      description: เข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่านเพื่อรับ JWT Token สำหรับการเข้าถึง
        API อื่นๆ
      parameters:
      - description: ข้อมูลการเข้าสู่ระบบ
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/login.Request'
      produces:
      - application/json
      responses:
        "200":
          description: เข้าสู่ระบบสำเร็จ
          schema:
            $ref: '#/definitions/login.Response'
        "401":
          description: ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
          schema:
            additionalProperties: true
            type: object
      summary: เข้าสู่ระบบ
      tags:
      - Users
  /v1/users/logout:
    post:
      description: Logout the current user by instructing the client to clear the
        JWT token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Logout User
      tags:
      - Users
  /v1/users/me:
    get:
      consumes:
      - application/json
      description: ดึงข้อมูลโปรไฟล์ของผู้คนที่กำลังเข้าสู่ระบบอยู่โดยใช้ JWT Token
      produces:
      - application/json
      responses:
        "200":
          description: ดึงข้อมูลสำเร็จ
          schema:
            $ref: '#/definitions/me.Response'
        "401":
          description: ไม่ได้รับอนุญาต (Token ไม่ถูกต้องหรือหมดอายุ)
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: ข้อมูลโปรไฟล์ส่วนตัว
      tags:
      - Users
  /v1/users/profile/image:
    patch:
      consumes:
      - application/json
      description: Update the profile image URL for the current user.
      parameters:
      - description: Update profile image request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/update_profile.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update Profile Image
      tags:
      - Users
  /v1/users/rank:
    get:
      description: Get current rank and spending progress for the last 4 months.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rank.Response'
      security:
      - BearerAuth: []
      summary: Get User Rank
      tags:
      - Users
  /v1/users/verify/firebase:
    post:
      consumes:
      - application/json
      description: ตรวจสอบ idToken ที่ได้รับจาก Firebase (ฝั่ง Frontend) เพื่อเปิดใช้งานบัญชีผู้ใช้อย่างเป็นทางการ
      parameters:
      - description: ข้อมูลการยืนยัน Firebase
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/verify_firebase.Request'
      produces:
      - application/json
      responses:
        "200":
          description: เปิดใช้งานบัญชีสำเร็จ
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Token ไม่ถูกต้อง หรือข้อมูลผิดพลาด
          schema:
            additionalProperties: true
            type: object
      summary: ยืนยันตัวตนผ่าน Firebase และเปิดใช้งานบัญชี
      tags:
      - Users
  /v1/wallet/topup:
    post:
      consumes:
      - application/json
      description: สร้างรายการธุรกรรมเติมเงินและรับ QR Code สำหรับชำระเงินผ่าน PromptPay
      parameters:
      - description: ระบุจำนวนเงินที่ต้องการเติม
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/topup.Request'
      produces:
      - application/json
      responses:
        "200":
          description: สร้างรายการเติมเงินสำเร็จ
          schema:
            $ref: '#/definitions/topup.Response'
      security:
      - BearerAuth: []
      summary: ขอเติมเงินเข้า Wallet (PromptPay)
      tags:
      - Wallet
  /v1/wallet/transfer:
    post:
      consumes:
      - application/json
      description: โอนเงินจาก Wallet ของเราไปยังผู้ใช้อื่นโดยระบุเบอร์โทรศัพท์ผู้รับ
      parameters:
      - description: ข้อมูลการโอนเงิน
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/transfer.Request'
      produces:
      - application/json
      responses:
        "200":
          description: โอนเงินสำเร็จ
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ข้อมูลไม่ถูกต้อง หรือยอดเงินไม่พอ
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: โอนเงินให้เพื่อน (P2P)
      tags:
      - Wallet
  /v1/wallet/verify-receiver:
    get:
      description: Find username by phone number for wallet transfer.
      parameters:
      - description: Receiver Phone Number
        in: query
        name: phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/verify_receiver.Response'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Verify Receiver
      tags:
      - Wallet
  /v1/wallet/webhook/paysolutions:
    post:
      consumes:
      - application/json
      description: Receives payment status updates from PaySolutions server.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: PaySolutions Webhook Callback
      tags:
      - Wallet
  /v1/zones:
    get:
      description: ดึงข้อมูลพื้นที่บริการทั้งหมด รวมถึงจุดจอด (Parking Zones) และพื้นที่ห้ามจอด
      produces:
      - application/json
      responses:
        "200":
          description: รายการพื้นที่
          schema:
            items:
              $ref: '#/definitions/entity.Zone'
            type: array
      summary: รายการพื้นที่บริการ (Zones)
      tags:
      - Zones
    post:
      consumes:
      - application/json
      description: สร้างจุดจอดรถ (P) หรือ ขอบเขตพื้นที่ให้บริการใหม่ โดยระบุพิกัดและรัศมี
      parameters:
      - description: ข้อมูลพื้นที่ที่ต้องการสร้าง
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_app_usecase_zone_create.Request'
      produces:
      - application/json
      responses:
        "201":
          description: สร้างสำเร็จ
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: สร้างพื้นที่บริการใหม่ (Admin Only)
      tags:
      - Zones
securityDefinitions:
  BearerAuth:
    description: Type 'Bearer ' followed by your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
