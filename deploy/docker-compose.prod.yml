version: '3.8'

services:
  # 1. PostgreSQL 16 + PostGIS for Geospatial Queries
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: bidkan-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: bidkan-prod-redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Mosquitto MQTT Broker (TCP 1883 for IoT ESP32, WS 9001 for Web)
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: bidkan-prod-mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # 4. Bidkan Core Go Backend API & Geofence Daemons
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    container_name: bidkan-prod-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis:${REDIS_PASSWORD}@redis:6379
      - MQTT_BROKER=tcp://mqtt:1883
      - PORT=8080
      - APP_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_CONNECT_WEBHOOK_SECRET=${STRIPE_CONNECT_WEBHOOK_SECRET}
      - STRIPE_CONNECT_ACCOUNT_TYPE=${STRIPE_CONNECT_ACCOUNT_TYPE:-express}
      - STRIPE_CONNECT_COUNTRY=${STRIPE_CONNECT_COUNTRY:-TH}
      - STRIPE_BACKOFFICE_URL=${STRIPE_BACKOFFICE_URL}
      - STRIPE_CLIENT_URL=${STRIPE_CLIENT_URL}
      - STRIPE_AUTO_PAYOUT_ENABLED=${STRIPE_AUTO_PAYOUT_ENABLED:-true}
      - STRIPE_AUTO_PAYOUT_INTERVAL=${STRIPE_AUTO_PAYOUT_INTERVAL:-24h}

  # 5. Backoffice Operator Console (Next.js Standalone)
  backoffice:
    build:
      context: ../../bidkan-backoffice
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_ENV: production
    container_name: bidkan-prod-backoffice
    restart: always
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - API_INTERNAL_URL=http://backend:8080/api/v1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_MQTT_WS_URL=${NEXT_PUBLIC_MQTT_WS_URL}
      - JWT_SECRET=${JWT_SECRET}

  # 6. Rider Mobile Client App (Next.js Standalone PWA)
  client:
    build:
      context: ../../bidkan-client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_ENV: production
    container_name: bidkan-prod-client
    restart: always
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_INTERNAL_URL=http://backend:8080/api/v1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_MQTT_WS_URL=${NEXT_PUBLIC_MQTT_WS_URL}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - JWT_SECRET=${JWT_SECRET}

  # 7. Nginx Reverse Proxy (SSL Gateway & Static Cache)
  nginx:
    image: nginx:alpine
    container_name: bidkan-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - backoffice
      - client

  # 8. Let's Encrypt Certbot SSL Renewer
  certbot:
    image: certbot/certbot
    container_name: bidkan-prod-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  certbot_conf:
  certbot_www:
