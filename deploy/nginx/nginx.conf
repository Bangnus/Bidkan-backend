events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # WebSocket Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream Definitions
    upstream backend_api {
        server backend:8080;
    }
    upstream backoffice_web {
        server backoffice:3001;
    }
    upstream client_web {
        server client:3000;
    }
    upstream mqtt_ws {
        server mqtt:9001;
    }

    # 1. HTTP Server: ACME Challenge & Redirect to HTTPS
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Healthcheck endpoint for load balancers / monitoring
        location /health {
            access_log off;
            return 200 "healthy\n";
        }

        # Fallback redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. API Gateway: api.*
    server {
        listen 443 ssl http2;
        server_name api.* "";

        ssl_certificate /etc/letsencrypt/live/bidkan/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bidkan/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # 3. Backoffice Operator Console: admin.*
    server {
        listen 443 ssl http2;
        server_name admin.*;

        ssl_certificate /etc/letsencrypt/live/bidkan/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bidkan/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://backoffice_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # 4. MQTT WebSocket: mqtt.*
    server {
        listen 443 ssl http2;
        server_name mqtt.*;

        ssl_certificate /etc/letsencrypt/live/bidkan/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bidkan/privkey.pem;

        location / {
            proxy_pass http://mqtt_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # 5. Rider Client PWA & Default Portal (bidkan.* / app.*)
    server {
        listen 443 ssl http2 default_server;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/bidkan/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bidkan/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Route API paths to backend if on single domain
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Client PWA
        location / {
            proxy_pass http://client_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
