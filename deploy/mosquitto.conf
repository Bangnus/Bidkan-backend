# Mosquitto ของ BidKan บน Droplet — ต้องมี user/รหัสผ่านเสมอ (พอร์ต 1883 เปิดออกอินเทอร์เน็ต)
# ไฟล์รหัสผ่านสร้างจาก .env.prod ตอน container เริ่ม (ดู entrypoint ใน docker-compose.prod.yml)
#   backend = API · device = กล่อง IoT บนจักรยาน (MQTT_USER/MQTT_PASS ใน BidKan-iot/include/config.h)

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true
